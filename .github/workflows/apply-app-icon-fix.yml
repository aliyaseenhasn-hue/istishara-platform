name: Apply app icon fix

on:
  push:
    branches: [main]
    paths:
      - '.github/icon-fix/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply valid app icon assets
        run: bash .github/icon-fix/apply.sh
      - name: Commit icon fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No icon changes to commit"
            exit 0
          fi
          git commit -m "fix: apply valid Istishara app icon assets"
          git push
