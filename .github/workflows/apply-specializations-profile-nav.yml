# trigger
name: Apply specialization and profile navigation update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-specializations-profile-nav.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Apply UI updates
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected block not found in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          replace(
              'lib/features/home/presentation/pages/home_page.dart',
              '    final categories = LegalSpecializations.all.take(8).toList();',
              '    final categories = LegalSpecializations.all;',
          )
          replace(
              'lib/features/home/presentation/pages/home_page.dart',
              '''                gridDelegate: const SliverGridDelegateWithFixedCrossAxisCount(\n                  crossAxisCount: 4,\n                  crossAxisSpacing: 14,\n                  mainAxisSpacing: 18,\n                  childAspectRatio: .74,\n                ),''',
              '''                gridDelegate: const SliverGridDelegateWithFixedCrossAxisCount(\n                  crossAxisCount: 3,\n                  crossAxisSpacing: 12,\n                  mainAxisSpacing: 16,\n                  childAspectRatio: .88,\n                ),''',
          )

          replace(
              'lib/shared/widgets/lawyer_more_menu_button.dart',
              "    _LawyerMenuAction(Icons.person_outline_rounded, 'ملفي المهني', '/lawyer-profile-edit'),\n",
              '',
          )

          replace(
              'lib/shared/widgets/main_bottom_nav.dart',
              '''  static const _lawyerItems = <_NavItem>[\n    _NavItem(Icons.home_outlined, Icons.home_rounded, 'الرئيسية'),\n    _NavItem(Icons.calendar_month_outlined, Icons.calendar_month_rounded, 'استشاراتي'),\n    _NavItem(Icons.settings_outlined, Icons.settings_rounded, 'الإعدادات'),\n  ];''',
              '''  static const _lawyerItems = <_NavItem>[\n    _NavItem(Icons.home_outlined, Icons.home_rounded, 'الرئيسية'),\n    _NavItem(Icons.calendar_month_outlined, Icons.calendar_month_rounded, 'استشاراتي'),\n    _NavItem(Icons.badge_outlined, Icons.badge_rounded, 'الملف المهني'),\n    _NavItem(Icons.settings_outlined, Icons.settings_rounded, 'الإعدادات'),\n  ];''',
          )
          replace(
              'lib/shared/widgets/main_bottom_nav.dart',
              "        ? switch (index) {0 => '/lawyer-home', 1 => '/bookings', 2 => '/app-settings', _ => '/lawyer-home'}",
              "        ? switch (index) {0 => '/lawyer-home', 1 => '/bookings', 2 => '/lawyer-profile-edit', 3 => '/app-settings', _ => '/lawyer-home'}",
          )

          replace(
              'lib/shared/widgets/app_shell.dart',
              "      if (location == '/app-settings' || location == '/profile' || location == '/notification-settings' || location == '/payment-methods' || location == '/help-center' || location == '/lawyer-profile-edit' || location == '/lawyer-availability' || location == '/lawyer-specialization-change' || location == '/lawyer-wallet') return 2;",
              "      if (location == '/lawyer-profile-edit') return 2;\n      if (location == '/app-settings' || location == '/profile' || location == '/notification-settings' || location == '/payment-methods' || location == '/help-center' || location == '/lawyer-availability' || location == '/lawyer-specialization-change' || location == '/lawyer-wallet') return 3;",
          )
          replace(
              'lib/shared/widgets/app_shell.dart',
              "        location == '/lawyer-profile-edit' ||\n",
              '',
          )

          replace(
              'test/main_bottom_nav_test.dart',
              "    expect(find.text('استشاراتي'), findsOneWidget);\n    expect(find.text('الإعدادات'), findsOneWidget);",
              "    expect(find.text('استشاراتي'), findsOneWidget);\n    expect(find.text('الملف المهني'), findsOneWidget);\n    expect(find.text('الإعدادات'), findsOneWidget);",
          )
          replace(
              'test/main_bottom_nav_test.dart',
              "  testWidgets('lawyer home menu exposes every unique secondary destination', (tester) async {",
              "  testWidgets('lawyer home menu keeps professional profile out of secondary tools', (tester) async {",
          )
          replace(
              'test/main_bottom_nav_test.dart',
              "        for (final path in ['/lawyer-profile-edit', '/lawyer-availability', '/lawyer-wallet'])",
              "        for (final path in ['/lawyer-availability', '/lawyer-wallet'])",
          )
          replace(
              'test/main_bottom_nav_test.dart',
              "    expect(find.text('ملفي المهني'), findsOneWidget);",
              "    expect(find.text('ملفي المهني'), findsNothing);",
          )
          replace(
              'test/main_bottom_nav_test.dart',
              "              bottomNavigationBar: MainBottomNav(currentIndex: 2, isLawyer: true),",
              "              bottomNavigationBar: MainBottomNav(currentIndex: 3, isLawyer: true),",
          )
          PY

      - name: Format Dart files
        run: |
          dart format \
            lib/features/home/presentation/pages/home_page.dart \
            lib/shared/widgets/lawyer_more_menu_button.dart \
            lib/shared/widgets/main_bottom_nav.dart \
            lib/shared/widgets/app_shell.dart \
            test/main_bottom_nav_test.dart

      - name: Commit update and remove one-time workflow
        run: |
          rm -f .github/workflows/apply-specializations-profile-nav.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/features/home/presentation/pages/home_page.dart \
            lib/shared/widgets/lawyer_more_menu_button.dart \
            lib/shared/widgets/main_bottom_nav.dart \
            lib/shared/widgets/app_shell.dart \
            test/main_bottom_nav_test.dart \
            .github/workflows/apply-specializations-profile-nav.yml
          git diff --cached --quiet && exit 0
          git commit -m "feat: show all specialties and move lawyer profile to bottom nav"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1
