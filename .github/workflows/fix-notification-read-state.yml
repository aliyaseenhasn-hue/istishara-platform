name: Fix notification read state

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-notification-read-state.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Apply notification read-state fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/features/profile/presentation/pages/notifications_page.dart')
          text = path.read_text()

          old_refresh = """    Future<void> refresh() async {
      ref.invalidate(notificationsProvider);
      ref.invalidate(unreadNotificationsCountProvider);
    }
"""
          new_refresh = """    Future<void> refresh() async {
      ref.invalidate(notificationsProvider);
      ref.invalidate(unreadNotificationsCountProvider);
      await ref.read(notificationsProvider.future);
      await ref.read(unreadNotificationsCountProvider.future);
    }
"""
          if old_refresh not in text:
              raise SystemExit('Expected refresh block not found')
          text = text.replace(old_refresh, new_refresh, 1)

          old_mark_all = """                  onMarkAll: unread == 0
                      ? null
                      : () async {
                          await markAllNotificationsAsRead();
                          await refresh();
                        },
"""
          new_mark_all = """                  onMarkAll: unread == 0
                      ? null
                      : () async {
                          try {
                            await markAllNotificationsAsRead();
                            await refresh();
                            if (context.mounted) {
                              ScaffoldMessenger.of(context).showSnackBar(
                                const SnackBar(content: Text('تم تحديد جميع الإشعارات كمقروءة')),
                              );
                            }
                          } catch (_) {
                            if (context.mounted) {
                              ScaffoldMessenger.of(context).showSnackBar(
                                const SnackBar(content: Text('تعذر تحديث حالة الإشعارات. حاول مرة أخرى.')),
                              );
                            }
                          }
                        },
"""
          if old_mark_all not in text:
              raise SystemExit('Expected mark-all block not found')
          text = text.replace(old_mark_all, new_mark_all, 1)

          old_label = "label: const Text('قراءة الكل'),"
          new_label = "label: const Text('تحديد الكل كمقروء'),"
          if old_label not in text:
              raise SystemExit('Expected mark-all label not found')
          text = text.replace(old_label, new_label, 1)

          path.write_text(text)
          PY

      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/fix-notification-read-state.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/profile/presentation/pages/notifications_page.dart .github/workflows/fix-notification-read-state.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: clear notification badge after marking read"
          git push origin HEAD:main

# Triggered once to apply the targeted notification fix.
