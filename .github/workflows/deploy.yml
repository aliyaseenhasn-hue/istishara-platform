name: Validate Netlify Web Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-web-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Clean Flutter build artifacts
        run: flutter clean

      - name: Install dependencies
        run: flutter pub get

      - name: Verify committed generated sources
        run: |
          set -euo pipefail
          test -f lib/app/router.g.dart
          test -f lib/shared/providers/global_loading_provider.g.dart

      - name: Verify Telegram auth hardening
        run: |
          set -euo pipefail
          file="supabase/functions/telegram-auth-v2/index.ts"
          test -f "$file"
          if grep -Fq "signInWithPassword" "$file"; then
            echo "::error::telegram-auth-v2 must not reset/use a generated password to mint sessions"
            exit 1
          fi
          grep -Fq "generateLink" "$file"
          grep -Fq "contact.user_id" "$file"
          grep -Fq "Telegram webhook secret missing" "$file"

      - name: Create .env file for analyzer
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_URL:-}" || { echo "::error::SUPABASE_URL secret is missing"; exit 1; }
          test -n "${SUPABASE_ANON_KEY:-}" || { echo "::error::SUPABASE_ANON_KEY secret is missing"; exit 1; }
          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > .env

      - name: Analyze Dart and Flutter code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Flutter tests
        run: flutter test -r expanded

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Clean Flutter build artifacts
        run: flutter clean

      - name: Install dependencies
        run: flutter pub get

      - name: Verify committed generated sources
        run: |
          set -euo pipefail
          test -f lib/app/router.g.dart
          test -f lib/shared/providers/global_loading_provider.g.dart

      - name: Create .env file from GitHub Secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_URL:-}" || { echo "::error::SUPABASE_URL secret is missing"; exit 1; }
          test -n "${SUPABASE_ANON_KEY:-}" || { echo "::error::SUPABASE_ANON_KEY secret is missing"; exit 1; }
          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > .env

      - name: Build Flutter web for Netlify root
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          PWA_VAPID_PUBLIC_KEY: ${{ secrets.PWA_VAPID_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          test -n "${PWA_VAPID_PUBLIC_KEY:-}" || { echo "::error::PWA_VAPID_PUBLIC_KEY secret is missing"; exit 1; }
          flutter build web --release --no-wasm-dry-run --pwa-strategy=none --base-href "/" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=VAPID_PUBLIC_KEY="$PWA_VAPID_PUBLIC_KEY"

          test -f build/web/index.html
          test -f build/web/manifest.json
          test -f build/web/assets/assets/icons/app_icon.png
          test -f build/web/pwa_service_worker_v5.js
          test -f build/web/flutter_bootstrap.js
          grep -q "<base href=\"/\">" build/web/index.html
          grep -Fq "https://istishara-iq.netlify.app/" build/web/index.html
          grep -Fq '"start_url": "/"' build/web/manifest.json
          grep -Fq '"scope": "/"' build/web/manifest.json
          grep -q "pwa_service_worker_v5.js?v=16" build/web/index.html
          grep -q "astshara-pwa-v16" build/web/pwa_service_worker_v5.js
          grep -Fq "_flutter.loader.load();" build/web/flutter_bootstrap.js
          if grep -Fq "_flutter.loader.load({" build/web/flutter_bootstrap.js; then
            echo "::error::Flutter bootstrap must not invoke a second service worker configuration"
            exit 1
          fi
          if grep -R -Fq "https://aliyaseenhasn-hue.github.io/istishara-platform" build/web; then
            echo "::error::GitHub Pages production URL must not remain in Netlify build output"
            exit 1
          fi

      - name: Upload Netlify-ready web artifact
        uses: actions/upload-artifact@v4
        with:
          name: netlify-web
          path: build/web
          if-no-files-found: error
          retention-days: 3
