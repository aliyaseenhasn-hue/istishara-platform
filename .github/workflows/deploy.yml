name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Clean Flutter build artifacts
        run: flutter clean

      - name: Install dependencies
        run: flutter pub get

      # Generated Dart sources are committed to the repository. Do not run
      # build_runner here: the pinned Riverpod generator/analyzer combination
      # is not compatible with the Dart analyzer bundled by Flutter 3.47.
      - name: Verify committed generated sources
        run: |
          set -euo pipefail
          test -f lib/app/router.g.dart
          test -f lib/shared/providers/global_loading_provider.g.dart

      - name: Verify Telegram auth hardening
        run: |
          set -euo pipefail
          file="supabase/functions/telegram-auth-v2/index.ts"
          test -f "$file"
          if grep -Fq "signInWithPassword" "$file"; then
            echo "::error::telegram-auth-v2 must not reset/use a generated password to mint sessions"
            exit 1
          fi
          grep -Fq "generateLink" "$file"
          grep -Fq "contact.user_id" "$file"
          grep -Fq "Telegram webhook secret missing" "$file"

      - name: Create .env file for analyzer
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_URL:-}" || { echo "::error::SUPABASE_URL secret is missing"; exit 1; }
          test -n "${SUPABASE_ANON_KEY:-}" || { echo "::error::SUPABASE_ANON_KEY secret is missing"; exit 1; }
          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > .env

      - name: Analyze Dart and Flutter code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Flutter tests
        run: flutter test -r expanded

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Clean Flutter build artifacts
        run: flutter clean

      - name: Install dependencies
        run: flutter pub get

      # Generated Dart sources are committed to the repository. Keep CI
      # deterministic and avoid invoking the incompatible code generator.
      - name: Verify committed generated sources
        run: |
          set -euo pipefail
          test -f lib/app/router.g.dart
          test -f lib/shared/providers/global_loading_provider.g.dart

      - name: Create .env file from GitHub Secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_URL:-}" || { echo "::error::SUPABASE_URL secret is missing"; exit 1; }
          test -n "${SUPABASE_ANON_KEY:-}" || { echo "::error::SUPABASE_ANON_KEY secret is missing"; exit 1; }
          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > .env

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Flutter web for GitHub Pages
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          PWA_VAPID_PUBLIC_KEY: ${{ secrets.PWA_VAPID_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          test -n "${PWA_VAPID_PUBLIC_KEY:-}" || { echo "::error::PWA_VAPID_PUBLIC_KEY secret is missing"; exit 1; }
          flutter build web --release --no-wasm-dry-run --base-href "/istishara-platform/" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=VAPID_PUBLIC_KEY="$PWA_VAPID_PUBLIC_KEY"

          test -f build/web/index.html
          test -f build/web/manifest.json
          test -f build/web/assets/assets/icons/app_icon.png
          test -f build/web/pwa_service_worker_v5.js
          grep -q "<base href=\"/istishara-platform/\">" build/web/index.html
          grep -q "pwa_service_worker_v5.js" build/web/index.html

      # Temporary export used to prepare the first Play Store upload bundle.
      # This block and the exported file are removed immediately after the
      # production-signed bundle is prepared.
      - name: Export first Play Store bundle
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          flutter build appbundle --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
          cp build/app/outputs/bundle/release/app-release.aab \
            build/web/play-prep-v1.aab

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
