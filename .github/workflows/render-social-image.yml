name: Render social media image

on:
  push:
    branches: [main]
    paths:
      - 'social-media/generate_post.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pillow arabic-reshaper python-bidi
      - name: Generate image
        run: python social-media/generate_post.py
      - name: Commit generated image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social-media/estishara-2026-09-12.png
          if ! git diff --cached --quiet; then
            git commit -m "chore: render Estishara social image"
            git push
          fi
