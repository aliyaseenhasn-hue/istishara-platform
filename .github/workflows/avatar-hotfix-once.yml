name: Avatar iOS Web Hotfix Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/avatar-hotfix-once.yml

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'run avatar hotfix')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply avatar rendering hotfix
        run: |
          python - <<'PY'
          from pathlib import Path

          home = Path('lib/features/home/presentation/pages/home_page.dart')
          text = home.read_text()
          text = text.replace("import 'package:cached_network_image/cached_network_image.dart';\n", '')
          anchor = "import '../../../../shared/widgets/hover_lift.dart';\n"
          safe_import = "import '../../../../shared/widgets/safe_network_avatar.dart';\n"
          if safe_import not in text:
              text = text.replace(anchor, anchor + safe_import)

          old_client = """              child: CircleAvatar(\n                backgroundColor: AppColors.surfaceContainerHighest,\n                backgroundImage: avatarUrl != null && avatarUrl!.isNotEmpty\n                    ? CachedNetworkImageProvider(avatarUrl!)\n                    : null,\n                child: avatarUrl == null || avatarUrl!.isEmpty\n                    ? const Icon(\n                        Icons.person_outline_rounded,\n                        color: AppColors.primary,\n                        size: 40,\n                      )\n                    : null,\n              ),\n"""
          new_client = """              child: SafeNetworkAvatar(\n                imageUrl: avatarUrl,\n                radius: 40,\n                backgroundColor: AppColors.surfaceContainerHighest,\n                iconColor: AppColors.primary,\n                iconSize: 40,\n              ),\n"""
          if old_client not in text:
              raise SystemExit('client avatar block not found')
          text = text.replace(old_client, new_client, 1)

          old_lawyer = """                CircleAvatar(\n                  radius: 22,\n                  backgroundColor: AppColors.primary.withValues(alpha: .10),\n                  backgroundImage: hasAvatar\n                      ? CachedNetworkImageProvider(lawyer.avatarUrl!)\n                      : null,\n                  child: hasAvatar\n                      ? null\n                      : const Icon(\n                          Icons.person_outline_rounded,\n                          color: AppColors.primary,\n                        ),\n                ),\n"""
          new_lawyer = """                SafeNetworkAvatar(\n                  imageUrl: hasAvatar ? lawyer.avatarUrl : null,\n                  radius: 22,\n                  backgroundColor: AppColors.primary.withValues(alpha: .10),\n                  iconColor: AppColors.primary,\n                  iconSize: 22,\n                ),\n"""
          if old_lawyer not in text:
              raise SystemExit('suggested lawyer avatar block not found')
          text = text.replace(old_lawyer, new_lawyer, 1)
          home.write_text(text)

          profile = Path('lib/features/profile/presentation/pages/profile_page.dart')
          text = profile.read_text()
          profile_anchor = "import '../../../../core/providers/theme_mode_provider.dart';\n"
          profile_import = "import '../../../../shared/widgets/safe_network_avatar.dart';\n"
          if profile_import not in text:
              text = text.replace(profile_anchor, profile_anchor + profile_import)

          old_profile = """          child: CircleAvatar(\n            radius: 49,\n            backgroundColor: AppColors.surfaceVariant,\n            backgroundImage: user.avatarUrl != null && user.avatarUrl!.isNotEmpty ? NetworkImage(user.avatarUrl!) : null,\n            child: user.avatarUrl == null || user.avatarUrl!.isEmpty ? const Icon(Icons.person_rounded, size: 52, color: AppColors.primary) : null,\n          ),\n"""
          new_profile = """          child: SafeNetworkAvatar(\n            imageUrl: user.avatarUrl,\n            radius: 49,\n            backgroundColor: AppColors.surfaceVariant,\n            iconColor: AppColors.primary,\n            icon: Icons.person_rounded,\n            iconSize: 52,\n          ),\n"""
          if old_profile not in text:
              raise SystemExit('profile hero avatar block not found')
          text = text.replace(old_profile, new_profile, 1)
          profile.write_text(text)
          PY

      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/avatar-hotfix-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/home/presentation/pages/home_page.dart \
                  lib/features/profile/presentation/pages/profile_page.dart \
                  .github/workflows/avatar-hotfix-once.yml
          git commit -m "fix: avoid black avatar textures on iOS web"
          git push origin HEAD:main
