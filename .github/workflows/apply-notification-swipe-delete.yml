name: Apply notification swipe delete

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-notification-swipe-delete.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Add secure swipe-to-delete notifications
        run: |
          python3 - <<'PY'
          from pathlib import Path

          provider = Path('lib/features/profile/presentation/providers/notifications_provider.dart')
          p = provider.read_text()
          if 'Future<void> deleteNotification(String id)' not in p:
              p += """

Future<void> deleteNotification(String id) async {
  final client = _clientOrNull();
  if (client == null) {
    throw StateError('Supabase is not available');
  }
  final profileId = await _currentProfileId();
  if (profileId == null) {
    throw StateError('No signed-in profile');
  }

  final deleted = await client
      .from('notifications')
      .delete()
      .eq('id', id)
      .eq('user_id', profileId)
      .select('id');

  if ((deleted as List).isEmpty) {
    throw StateError('Notification was not deleted');
  }
}
"""
              provider.write_text(p)

          page = Path('lib/features/profile/presentation/pages/notifications_page.dart')
          text = page.read_text()
          old = """                    itemBuilder: (context, index) => _NotificationCard(
                      item: items[index],
                      onOpen: () => _open(context, items[index]),
                      onRefresh: refresh,
                    ),
"""
          new = """                    itemBuilder: (context, index) {
                      final item = items[index];
                      return Dismissible(
                        key: ValueKey('notification-${item.id}'),
                        direction: DismissDirection.endToStart,
                        dismissThresholds: const {
                          DismissDirection.endToStart: 0.35,
                        },
                        confirmDismiss: (_) async {
                          try {
                            await deleteNotification(item.id);
                            return true;
                          } catch (_) {
                            if (context.mounted) {
                              ScaffoldMessenger.of(context).showSnackBar(
                                const SnackBar(
                                  content: Text('تعذر حذف الإشعار. حاول مرة أخرى.'),
                                ),
                              );
                            }
                            return false;
                          }
                        },
                        onDismissed: (_) {
                          ref.invalidate(notificationsProvider);
                          ref.invalidate(unreadNotificationsCountProvider);
                          if (context.mounted) {
                            ScaffoldMessenger.of(context).showSnackBar(
                              const SnackBar(content: Text('تم حذف الإشعار')),
                            );
                          }
                        },
                        background: Container(
                          margin: const EdgeInsets.only(bottom: 13),
                          padding: const EdgeInsets.symmetric(horizontal: 22),
                          alignment: Alignment.centerLeft,
                          decoration: BoxDecoration(
                            color: AppColors.error,
                            borderRadius: BorderRadius.circular(23),
                          ),
                          child: const Row(
                            mainAxisSize: MainAxisSize.min,
                            children: [
                              Icon(Icons.delete_outline_rounded, color: Colors.white),
                              SizedBox(width: 8),
                              Text(
                                'حذف',
                                style: TextStyle(
                                  color: Colors.white,
                                  fontWeight: FontWeight.w900,
                                ),
                              ),
                            ],
                          ),
                        ),
                        child: _NotificationCard(
                          item: item,
                          onOpen: () => _open(context, item),
                          onRefresh: refresh,
                        ),
                      );
                    },
"""
          if old not in text:
              raise SystemExit('Expected notification itemBuilder block not found')
          text = text.replace(old, new, 1)
          page.write_text(text)
          PY

      - name: Format changed Dart files
        run: |
          dart format \
            lib/features/profile/presentation/providers/notifications_provider.dart \
            lib/features/profile/presentation/pages/notifications_page.dart

      - name: Commit and remove one-time workflow
        run: |
          rm -f .github/workflows/apply-notification-swipe-delete.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/features/profile/presentation/providers/notifications_provider.dart \
            lib/features/profile/presentation/pages/notifications_page.dart \
            .github/workflows/apply-notification-swipe-delete.yml
          git diff --cached --quiet && exit 0
          git commit -m "feat: swipe right to delete notifications"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1

# trigger
