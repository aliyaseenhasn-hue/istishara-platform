name: Apply landing account button layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-landing-account-layout.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Update landing account buttons
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/features/home/presentation/pages/landing_page.dart')
          text = path.read_text()

          top_create = """                Padding(
                  padding: const EdgeInsets.only(
                    left: 14,
                    right: 4,
                    top: 8,
                    bottom: 8,
                  ),
                  child: FilledButton(
                    onPressed: () => context.push('/signup'),
                    style: FilledButton.styleFrom(
                      backgroundColor: _gold,
                      foregroundColor: _navy,
                      padding: const EdgeInsets.symmetric(horizontal: 14),
                    ),
                    child: const Text(
                      'إنشاء حساب',
                      style: TextStyle(fontWeight: FontWeight.w800, fontSize: 13),
                    ),
                  ),
                ),
"""
          if top_create not in text:
              raise SystemExit('Expected top create-account button was not found')
          text = text.replace(top_create, '', 1)

          login_anchor = """                      const SizedBox(height: 12),
                      SizedBox(
                        width: double.infinity,
                        height: 48,
                        child: OutlinedButton.icon(
                          onPressed: () => context.push('/login'),
"""
          if login_anchor not in text:
              raise SystemExit('Expected hero login button was not found')

          create_button = """                      const SizedBox(height: 12),
                      SizedBox(
                        width: double.infinity,
                        height: 48,
                        child: FilledButton.icon(
                          onPressed: () => context.push('/signup'),
                          icon: const Icon(Icons.person_add_alt_1_rounded, size: 20),
                          style: FilledButton.styleFrom(
                            backgroundColor: _gold,
                            foregroundColor: _navy,
                            shape: RoundedRectangleBorder(
                              borderRadius: BorderRadius.circular(12),
                            ),
                          ),
                          label: const Text(
                            'إنشاء حساب',
                            style: TextStyle(
                              fontWeight: FontWeight.w800,
                              fontSize: 15,
                            ),
                          ),
                        ),
                      ),
"""
          text = text.replace(login_anchor, create_button + login_anchor, 1)
          path.write_text(text)
          PY

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/home/presentation/pages/landing_page.dart
          git diff --cached --quiet && exit 0
          git commit -m "ui: move create account button into landing hero"
          git push origin HEAD:main
