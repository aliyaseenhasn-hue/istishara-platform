name: astshara
description: LawConnect - A professional legal platform connecting clients with lawyers in Iraq.
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 2.6.1
  riverpod_annotation: 2.6.1
  supabase_flutter: ^2.6.0
  storage_client: ^2.6.0
  go_router: ^14.2.0
  hive: ^2.2.3
  hive_flutter: 1.1.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  intl: ^0.20.2
  logger: ^2.4.0
  google_fonts: ^6.3.3
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^17.2.1
  audioplayers: ^6.1.0
  flutter_dotenv: ^5.2.1
  image_picker: ^1.1.2
  file_picker: ^10.3.8
  url_launcher: ^6.3.0
  web: ^1.1.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.5.4
  freezed: ^3.1.0
  riverpod_generator: 2.6.5
  json_serializable: ^6.9.5
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/app_icon.png
    - assets/icons/app_icon_v2.png
    - assets/landing/lawyer_client.svg
    - assets/landing/pwa_iphone_share.svg
    - assets/landing/pwa_iphone_add_home.svg
    - assets/landing/pwa_iphone_confirm_add.svg
    - assets/landing/pwa_iphone_share_app.svg
