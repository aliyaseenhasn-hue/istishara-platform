  <style>

    html, body { margin: 0; padding: 0; width: 100%; height: 100%; min-height: 100%; background: #F7F8F6; direction: rtl; overflow: hidden; overscroll-behavior: none; }
    body { font-family: 'Cairo', sans-serif; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    /* iOS Safari can auto-zoom focused DOM inputs below 16px. Flutter Web
       uses DOM inputs internally for text editing, so keep those editing
       surfaces at a 16px floor without changing the painted Flutter field. */
    input, textarea, [contenteditable="true"] { font-size: 16px !important; }

<body>
  <script>
    (function () {
      function isEditingText() {
        var element = document.activeElement;
        if (!element) return false;
        var tagName = (element.tagName || '').toUpperCase();
        return tagName === 'INPUT' || tagName === 'TEXTAREA' || element.isContentEditable === true;
      }

      function keyboardLooksOpen() {
        if (!window.visualViewport) return false;
        return (window.innerHeight - window.visualViewport.height) > 120;
      }

      function syncViewportHeight(force) {
        // iOS Safari/PWA shrinks visualViewport while its keyboard is open.
        // Never copy that reduced height to html/body or Flutter itself gets
        // squeezed to the small area above the keyboard.
        if (!force && (isEditingText() || keyboardLooksOpen())) return;
        var height = window.innerHeight;
        document.documentElement.style.height = height + 'px';
        document.body.style.height = height + 'px';
      }

      syncViewportHeight(true);
      window.addEventListener('resize', function () {
        syncViewportHeight(false);
      }, { passive: true });
      window.addEventListener('orientationchange', function () {
        setTimeout(function () { syncViewportHeight(true); }, 180);
      }, { passive: true });
      document.addEventListener('focusout', function () {
        setTimeout(function () { syncViewportHeight(false); }, 250);
      }, { passive: true });
    })();

    window.astsharaGetPushDeviceKey = function() {
      try {
        const storageKey = 'astshara_push_device_key_v1';
        let value = localStorage.getItem(storageKey);
        if (!value) {
          value = (window.crypto && crypto.randomUUID)
            ? crypto.randomUUID()
            : 'dev-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2);
          localStorage.setItem(storageKey, value);
        }
        return value;
      } catch (_) {
        return '';
      }
    };

    async function astsharaCurrentPushSubscription() {
      if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) return null;
      if (Notification.permission !== 'granted') return null;
      const registration = await navigator.serviceWorker.ready;
      return await registration.pushManager.getSubscription();
    }

    window.astsharaGetExistingPushSubscription = async function() {
      try {
        const subscription = await astsharaCurrentPushSubscription();
        return subscription ? JSON.stringify(subscription.toJSON()) : null;
      } catch (error) {
        console.warn('PWA existing push subscription lookup failed:', error);
        return null;
      }
    };

    window.astsharaEnablePush = async function(vapidPublicKey) {
      try {
        if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) return null;
        const permission = await Notification.requestPermission();
        if (permission !== 'granted') return null;
        const registration = await navigator.serviceWorker.ready;
        let subscription = await registration.pushManager.getSubscription();
        if (!subscription) {
          const padding = '='.repeat((4 - vapidPublicKey.length % 4) % 4);
          const base64 = vapidPublicKey.replace(/-/g, '+').replace(/_/g, '/') + padding;
          const binary = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
          subscription = await registration.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: binary });
        }
        return JSON.stringify(subscription.toJSON());
      } catch (error) {
        console.warn('PWA push enable failed:', error);
        return null;
      }
    };

    window.astsharaGetPushState = async function() {
      try {
        if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) {
          return JSON.stringify({ permission: 'unsupported', subscribed: false });
        }
        const permission = Notification.permission;
        const registration = await navigator.serviceWorker.ready;
        const subscription = await registration.pushManager.getSubscription();
        return JSON.stringify({ permission: permission, subscribed: Boolean(subscription) });
      } catch (error) {
        console.warn('PWA push state check failed:', error);
        return JSON.stringify({ permission: Notification.permission || 'unknown', subscribed: false });
      }
    };

    window.astsharaDisablePush = async function() {
      try {
        if (!('serviceWorker' in navigator)) return true;
        const registration = await navigator.serviceWorker.ready;
        const subscription = await registration.pushManager.getSubscription();
        if (!subscription) return true;
        return await subscription.unsubscribe();
      } catch (error) {
        console.warn('PWA push disable failed:', error);
        return false;
      }
    };

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('pwa_service_worker_v5.js?v=11', { scope: './', updateViaCache: 'none' }).catch((error) => console.warn('PWA service worker registration failed:', error));
      });
    }
  </script>
